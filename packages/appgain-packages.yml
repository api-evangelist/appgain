note: >-
  Appgain distributes its Android SDK from a SELF-HOSTED Maven repository
  (sdk.appgain.io), not Maven Central — a search of Maven Central for
  g:io.appgain.sdk returns zero results. The self-hosted repo is the authoritative
  source for the Android version and it is materially AHEAD of the documentation:
  the repo publishes 5.1.11 (2026-05-24) while the install page still says 5.0.1, the
  Android FAQ says 5.0.0, and the React Native page says 4.4.0. Versions and dates
  below are read from registry metadata, not from prose.
