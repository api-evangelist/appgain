caveats:
- >-
  Input schemas are not derivable to OpenAPI fidelity. Appgain publishes no OpenAPI;
  the shapes come from example request bodies in the Postman collection, which show
  which fields exist but not which are required, their types, or their enums.
- >-
  Twelve of the seventeen tools are irreversible sends. An MCP server over this API
  would need a confirmation gate on every send_* tool: there is no idempotency key
  (conventions/appgain-conventions.yml), so a retried call re-sends the campaign.
- >-
  The two Parse tools require a MASTER key, which is an unrestricted admin credential.
  They should not be exposed to an agent on the same footing as the project-scoped
  tools.
