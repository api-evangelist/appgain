aid: appgain
name: Appgain
description: Appgain is an omnichannel messaging and mobile marketing automation platform,
  originally out of the MENA region, that lets marketers acquire, engage, and retain
  mobile and web users across push notifications, in-app messaging, email, SMS, WhatsApp,
  and web push from a single cloud. Its REST API and mobile SDKs power smart deep links,
  micro landing pages, behavior-triggered automation journeys, a customer data platform
  (CDP) with real-time event logging and purchase tracking, and multi-channel campaign
  delivery, with marketplace apps for Shopify, Zid, and Salla and no-code integrations
  via Zapier and n8n. The backend is built on the open-source Parse Server stack, and
  first-party SDKs cover Android, iOS, Flutter, React Native, Cordova/Ionic, and web.
  Since 2026 the company positions itself as an "AI Workforce Platform" for MENA
  businesses, adding AI agent products - a RAG-powered customer bot, AI call
  intelligence with Arabic and English transcription, a visual bot builder, and a
  unified inbox - on top of the messaging core. The only machine-readable contract
  Appgain publishes is a public Postman collection served from its own apidocs
  subdomain; there is no OpenAPI.
